# Build rack for the supported targets with the released RGC toolchain.
#
# The `rgc-lang/rgc` release named by RGC_TAG supplies the compiler (binary plus
# lib/). rack is self-hosted: the released compiler builds rack0, rack0 builds
# rack1, and rack1 rebuilds rack2 from a clean tree; rack1 and rack2 must be
# byte-identical.
#
# Windows builds use the MSVC toolchain: rgc links by invoking g++, so the job
# installs a g++.cmd wrapper that translates the link line to cl.exe with the
# static CRT, ws2_32 and bcrypt. /Brepro keeps the PE image deterministic so the
# two bootstrap generations can be compared byte for byte.
#
# Assets:
#   rack-<version>-<target>.tar.gz   rack binary, LICENSE, README
#   SHA256SUMS

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.4.2); it must already exist
        required: true
      rgc_tag:
        description: RGC toolchain release used to build rack
        required: false
        default: v0.0.3
      platforms:
        description: Comma-separated platforms, or all
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RGC_REPO: rgc-lang/rgc
  RGC_TAG: ${{ inputs.rgc_tag || 'v0.0.3' }}

jobs:
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.matrix.outputs.version }}
      tag: ${{ steps.matrix.outputs.tag }}
      rgc_version: ${{ steps.matrix.outputs.rgc_version }}
    steps:
      - name: Resolve tag and platform matrix
        id: matrix
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          RGC_TAG: ${{ env.RGC_TAG }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_TAG"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must look like vX.Y.Z, got: $tag" >&2
            exit 1
          fi
          if ! [[ "$RGC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: rgc_tag must look like vX.Y.Z, got: $RGC_TAG" >&2
            exit 1
          fi
          version="${tag#v}"
          rgc_version="${RGC_TAG#v}"
          python3 - "$tag" "$version" "$rgc_version" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          tag, version, rgc_version = sys.argv[1], sys.argv[2], sys.argv[3]
          all_platforms = [
              {"platform": "linux-x64", "target": "x86_64-unknown-linux-gnu", "os": "linux", "arch": "x64", "runner": "ubuntu-latest", "ext": "tar.gz"},
              {"platform": "linux-arm64", "target": "aarch64-unknown-linux-gnu", "os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "ext": "tar.gz"},
              {"platform": "macos-x64", "target": "x86_64-apple-darwin", "os": "macos", "arch": "x64", "runner": "macos-15-intel", "ext": "tar.gz"},
              {"platform": "macos-arm64", "target": "aarch64-apple-darwin", "os": "macos", "arch": "arm64", "runner": "macos-15", "ext": "tar.gz"},
              {"platform": "windows-x64", "target": "x86_64-pc-windows-msvc", "os": "windows", "arch": "x64", "runner": "windows-latest", "ext": "zip"},
              {"platform": "windows-arm64", "target": "aarch64-pc-windows-msvc", "os": "windows", "arch": "arm64", "runner": "windows-11-arm", "ext": "zip"},
          ]
          raw = os.environ["PLATFORMS"].strip()
          if raw == "all":
              selected = all_platforms
          else:
              requested = [p.strip() for p in raw.split(",") if p.strip()]
              known = {p["platform"] for p in all_platforms}
              unknown = sorted(set(requested) - known)
              if unknown:
                  raise SystemExit("unknown platform(s): " + ", ".join(unknown))
              selected = [p for p in all_platforms if p["platform"] in requested]
          if not selected:
              raise SystemExit("no platforms selected")
          print("tag=" + tag)
          print("version=" + version)
          print("rgc_version=" + rgc_version)
          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))
          PY

  test:
    name: test (linux-x64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download RGC compiler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p toolchain
          gh release download "$RGC_TAG" --repo "$RGC_REPO" \
            --pattern "rgc-${{ needs.prepare.outputs.rgc_version }}-x86_64-unknown-linux-gnu.tar.gz" \
            --dir toolchain --clobber
          tar -xzf toolchain/rgc-*.tar.gz -C toolchain
          echo "RGC=$PWD/toolchain/rgc" >> "$GITHUB_ENV"

      - name: Bootstrap and test
        run: |
          set -euo pipefail
          ./tests/bootstrap.sh
          RACK_BIN="$PWD/target/bin/rack" ./tests/test.sh

  dist:
    name: dist (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download RGC compiler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p toolchain
          asset="rgc-${{ needs.prepare.outputs.rgc_version }}-${{ matrix.target }}.${{ matrix.ext }}"
          gh release download "$RGC_TAG" --repo "$RGC_REPO" \
            --pattern "$asset" --dir toolchain --clobber
          echo "RGC_ARCHIVE=$asset" >> "$GITHUB_ENV"

      - name: Extract RGC compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "toolchain/$env:RGC_ARCHIVE" -DestinationPath toolchain -Force

      - name: Extract RGC compiler (Unix)
        if: runner.os != 'Windows'
        run: tar -xzf "toolchain/$RGC_ARCHIVE" -C toolchain

      - name: Set up the MSVC linker shim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = if ("${{ matrix.arch }}" -eq "arm64") { "arm64" } else { "x64" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvars`" $arch >nul 2>&1 && set" | ForEach-Object {
            $i = $_.IndexOf("=")
            if ($i -gt 0) { Set-Item -Path ("env:" + $_.Substring(0, $i)) -Value $_.Substring($i + 1) }
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe not found after vcvarsall $arch"
          }
          # Later steps (and cl.exe under g++.cmd) need the vcvars environment.
          foreach ($name in @("PATH", "INCLUDE", "LIB", "LIBPATH")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

          # rgc links by invoking `g++ <obj> -o <out> -lws2_32 -lbcrypt`; translate
          # that to cl.exe with the static CRT and a reproducible PE timestamp.
          $wrapDir = Join-Path $env:RUNNER_TEMP "rgc-link"
          New-Item -ItemType Directory -Force -Path $wrapDir | Out-Null
          @'
          $obj = $null; $out = $null; $libs = @(); $linkFlags = @("/Brepro", "/STACK:16777216")
          for ($i = 0; $i -lt $args.Count; $i++) {
            $a = $args[$i]
            if ($a -eq "-g" -or $a -eq "-lm" -or $a -eq "-lpthread" -or $a -eq "-fPIC") { continue }
            if ($a -eq "-o") { $i++; $out = $args[$i]; continue }
            if ($a -eq "-lws2_32") { $libs += "ws2_32.lib"; continue }
            if ($a -eq "-lbcrypt") { $libs += "bcrypt.lib"; continue }
            if ($a -eq "-shared") { $linkFlags += "/DLL"; continue }
            if ($null -eq $obj -and -not $a.StartsWith("-")) { $obj = $a; continue }
            $libs += $a
          }
          & cl.exe /nologo /MT $obj /link @linkFlags ("/OUT:" + $out) @libs `
            ws2_32.lib bcrypt.lib `
            libcmt.lib libucrt.lib libvcruntime.lib legacy_stdio_definitions.lib
          exit $LASTEXITCODE
          '@ | Set-Content -Path (Join-Path $wrapDir "link.ps1") -Encoding ascii
          "@echo off`r`npowershell -NoProfile -ExecutionPolicy Bypass -File `"%~dp0link.ps1`" %*`r`n" |
            Set-Content -Path (Join-Path $wrapDir "g++.cmd") -Encoding ascii
          "RGC_LINK_SHIM=$wrapDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap and package
        run: |
          set -euo pipefail
          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=".exe"
            export PATH="$(cygpath -u "$RGC_LINK_SHIM"):$PATH"
            export RGC="$(cygpath -w "$PWD/toolchain/rgc.exe")"
          else
            export RGC="$PWD/toolchain/rgc"
          fi
          ./tests/bootstrap.sh
          RACK="$PWD/target/bin/rack$EXE"
          "$RACK" --version

          # End-to-end smoke test: scaffold, build, link and run a fresh project.
          SMOKE="$(mktemp -d)"
          ( cd "$SMOKE" && "$RACK" new smoke && cd smoke && "$RACK" run > run.out 2> run.err )
          grep -q "hello from smoke" "$SMOKE/smoke/run.out"
          if grep -Eq "batch-parameter|syntax of the command is incorrect" "$SMOKE/smoke/run.err"; then
            echo "error: shell noise while building on Windows:" >&2
            cat "$SMOKE/smoke/run.err" >&2
            exit 1
          fi

          mkdir -p staging dist
          cp "target/bin/rack$EXE" "staging/rack$EXE"
          cp LICENSE README.md staging/
          tar -czf "dist/rack-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz" \
            -C staging "rack$EXE" LICENSE README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [prepare, test, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "rack $VERSION" \
              --generate-notes
          fi

      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(rack-*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no release assets" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" "${files[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
